  <rect x="228" y="266" width="92" height="10" rx="5" fill="#8a3c0e" fill-opacity="0.9"/>
  <line x1="236" y1="276" x2="236" y2="326" stroke="#3d1804" stroke-width="3"/>
  <line x1="312" y1="276" x2="312" y2="326" stroke="#3d1804" stroke-width="3"/>

  <!-- ground -->
  <rect x="20" y="324" width="520" height="8" rx="4" fill="url(#ground)"/>

  <!-- palms -->
  <g stroke="#2e1103" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round">
    <path d="M52 324 C54 296 50 276 44 262"/>
    <path d="M512 324 C510 300 514 282 520 268"/>
  </g>
  <g fill="none" stroke="#3a1704" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round">
    <path d="M44 262 C30 252 18 252 8 258"/>
    <path d="M44 262 C36 246 26 240 14 240"/>
    <path d="M44 262 C50 246 60 238 74 236"/>
    <path d="M44 262 C56 252 68 250 80 254"/>
    <path d="M520 268 C508 256 496 254 486 258"/>
    <path d="M520 268 C514 252 504 246 492 246"/>
    <path d="M520 268 C528 254 538 248 550 248"/>
  </g>

  <!-- bushes -->
  <g fill="#331303" fill-opacity="0.8">
    <ellipse cx="140" cy="322" rx="22" ry="9"/>
    <ellipse cx="176" cy="324" rx="16" ry="7"/>
    <ellipse cx="392" cy="322" rx="20" ry="8"/>
    <ellipse cx="424" cy="324" rx="14" ry="6"/>
  </g>

  <!-- entrance light glow -->
  <ellipse cx="274" cy="326" rx="52" ry="8" fill="#ffd9a0" fill-opacity="0.18"/>
