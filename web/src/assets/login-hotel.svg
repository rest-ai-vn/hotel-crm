  <rect x="352" y="192" width="120" height="134" rx="6" fill="url(#wing)"/>
  <g fill="url(#glass)">
    <rect x="370" y="210" width="18" height="13" rx="2.5" opacity="0.45"/>
    <rect x="400" y="210" width="18" height="13" rx="2.5"/>
    <rect x="430" y="210" width="18" height="13" rx="2.5" opacity="0.35"/>
    <rect x="370" y="238" width="18" height="13" rx="2.5"/>
    <rect x="400" y="238" width="18" height="13" rx="2.5" opacity="0.4"/>
    <rect x="430" y="238" width="18" height="13" rx="2.5"/>
    <rect x="370" y="266" width="18" height="13" rx="2.5" opacity="0.35"/>
    <rect x="400" y="266" width="18" height="13" rx="2.5"/>
    <rect x="430" y="266" width="18" height="13" rx="2.5" opacity="0.5"/>
    <rect x="370" y="294" width="18" height="13" rx="2.5"/>
