  <rect x="222" y="82" width="104" height="22" rx="8" fill="url(#bldg)"/>
  <!-- rooftop sign -->
  <rect x="240" y="56" width="68" height="20" rx="6" fill="#2b0f02" fill-opacity="0.75"/>
  <text x="274" y="71" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#ffd9a0">HOTEL</text>
  <line x1="252" y1="76" x2="252" y2="82" stroke="#2b0f02" stroke-opacity="0.75" stroke-width="3"/>
  <line x1="296" y1="76" x2="296" y2="82" stroke="#2b0f02" stroke-opacity="0.75" stroke-width="3"/>

