    <rect x="254" y="116" width="20" height="14" rx="3" opacity="0.4"/>
    <rect x="286" y="116" width="20" height="14" rx="3"/>
    <rect x="222" y="146" width="20" height="14" rx="3" opacity="0.45"/>
    <rect x="254" y="146" width="20" height="14" rx="3"/>
    <rect x="286" y="146" width="20" height="14" rx="3" opacity="0.35"/>
    <rect x="222" y="176" width="20" height="14" rx="3"/>
    <rect x="254" y="176" width="20" height="14" rx="3" opacity="0.5"/>
    <rect x="286" y="176" width="20" height="14" rx="3"/>
    <rect x="222" y="206" width="20" height="14" rx="3" opacity="0.4"/>
    <rect x="254" y="206" width="20" height="14" rx="3"/>
    <rect x="286" y="206" width="20" height="14" rx="3" opacity="0.45"/>
    <rect x="222" y="236" width="20" height="14" rx="3"/>
    <rect x="254" y="236" width="20" height="14" rx="3" opacity="0.35"/>
    <rect x="286" y="236" width="20" height="14" rx="3"/>
  </g>

  <!-- entrance -->
  <rect x="244" y="272" width="60" height="54" rx="8" fill="#2b0f02" fill-opacity="0.6"/>
  <path d="M244 292 a30 20 0 0 1 60 0 v34 h-60 z" fill="url(#glass)" opacity="0.85"/>
  <rect x="270" y="288" width="4" height="38" fill="#3d1804"/>
