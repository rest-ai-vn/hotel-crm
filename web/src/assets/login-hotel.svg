<svg viewBox="0 0 560 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minh họa khách sạn ban đêm">
  <defs>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c2606" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#3d1804" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b2f09" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#471d05" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffe9c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb35c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1503" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2b0f02" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- moon -->
  <circle cx="468" cy="66" r="60" fill="url(#moonGlow)"/>
  <circle cx="468" cy="66" r="22" fill="#fff4dd" fill-opacity="0.95"/>
  <circle cx="461" cy="60" r="5" fill="#f3ddb8" fill-opacity="0.5"/>
  <circle cx="476" cy="74" r="3.5" fill="#f3ddb8" fill-opacity="0.45"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="46" r="2" fill-opacity="0.85"/>
    <circle cx="128" cy="26" r="1.5" fill-opacity="0.6"/>
    <circle cx="205" cy="58" r="1.8" fill-opacity="0.7"/>
    <circle cx="300" cy="30" r="1.4" fill-opacity="0.55"/>
    <circle cx="356" cy="70" r="1.8" fill-opacity="0.7"/>
    <circle cx="88" cy="96" r="1.4" fill-opacity="0.5"/>
    <circle cx="252" cy="94" r="1.3" fill-opacity="0.45"/>
    <circle cx="530" cy="140" r="1.6" fill-opacity="0.6"/>
    <circle cx="38" cy="160" r="1.5" fill-opacity="0.5"/>
  </g>

  <!-- left wing -->
  <rect x="76" y="176" width="112" height="150" rx="6" fill="url(#wing)"/>
  <g fill="url(#glass)">
    <rect x="92" y="194" width="18" height="13" rx="2.5"/>
    <rect x="122" y="194" width="18" height="13" rx="2.5" opacity="0.35"/>
    <rect x="152" y="194" width="18" height="13" rx="2.5"/>
    <rect x="92" y="222" width="18" height="13" rx="2.5" opacity="0.35"/>
    <rect x="122" y="222" width="18" height="13" rx="2.5"/>
    <rect x="152" y="222" width="18" height="13" rx="2.5" opacity="0.5"/>
    <rect x="92" y="250" width="18" height="13" rx="2.5"/>
    <rect x="122" y="250" width="18" height="13" rx="2.5" opacity="0.4"/>
    <rect x="152" y="250" width="18" height="13" rx="2.5"/>
    <rect x="92" y="278" width="18" height="13" rx="2.5" opacity="0.5"/>
    <rect x="122" y="278" width="18" height="13" rx="2.5"/>
    <rect x="152" y="278" width="18" height="13" rx="2.5" opacity="0.35"/>
  </g>

